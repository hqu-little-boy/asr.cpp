name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to publish when dispatching manually from a branch
        required: false
        type: string

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            backend: openblas
            vcpkg_triplet: x64-linux
            glslc_suffix: ''
            pkgconfig_suffix: ''
            vcpkg_cache: vcpkg-linux-openblas
            vcpkg_root: /tmp/vcpkg
            cmake_args: -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS -DGGML_VULKAN=OFF
          - os: ubuntu-latest
            name: linux
            backend: vulkan
            vcpkg_triplet: x64-linux
            glslc_suffix: ''
            pkgconfig_suffix: ''
            vcpkg_cache: vcpkg-linux-vulkan
            vcpkg_root: /tmp/vcpkg
            cmake_args: -DGGML_BLAS=OFF -DGGML_VULKAN=ON
          - os: windows-latest
            name: windows
            backend: openblas
            vcpkg_triplet: x64-windows-static
            glslc_suffix: .exe
            pkgconfig_suffix: .exe
            vcpkg_cache: vcpkg-windows-openblas
            vcpkg_root: C:\vcpkg
            cmake_args: -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS -DGGML_VULKAN=OFF
          - os: windows-latest
            name: windows
            backend: vulkan
            vcpkg_triplet: x64-windows-static
            glslc_suffix: .exe
            pkgconfig_suffix: .exe
            vcpkg_cache: vcpkg-windows-vulkan
            vcpkg_root: C:\vcpkg
            cmake_args: -DGGML_BLAS=OFF -DGGML_VULKAN=ON

    name: Release · ${{ matrix.name }} (${{ matrix.backend }})
    runs-on: ${{ matrix.os }}

    env:
      VCPKG_ROOT: ${{ matrix.vcpkg_root }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      PKG_CONFIG_EXECUTABLE: ${{ matrix.os == 'windows-latest' && format('{0}/installed/{1}/tools/pkgconf/pkgconf{2}', matrix.vcpkg_root, matrix.vcpkg_triplet, matrix.pkgconfig_suffix) || '' }}
      VULKAN_GLSLC_EXECUTABLE: ${{ matrix.backend == 'vulkan' && format('{0}/installed/{1}/bin/glslc{2}', matrix.vcpkg_root, matrix.vcpkg_triplet, matrix.glslc_suffix) || '' }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ── vcpkg bootstrap ──────────────────────
      - name: Bootstrap vcpkg (Linux)
        if: matrix.name == 'linux'
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Bootstrap vcpkg (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ matrix.vcpkg_cache }}-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: ${{ matrix.vcpkg_cache }}-static-

      # ── system dependencies ───────────────────
      - name: Install system packages (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            pkg-config libssl-dev libcurl4-openssl-dev \
            zip unzip tar curl git \
            glslang-tools

      # ── configure & build ─────────────────────
      - name: Configure CMake (Linux)
        if: matrix.name == 'linux'
        shell: bash
        run: |
          PKGCONFIG_ARGS=()
          if [[ -n "${PKG_CONFIG_EXECUTABLE}" ]]; then
            PKGCONFIG_ARGS=(-DPKG_CONFIG_EXECUTABLE="${PKG_CONFIG_EXECUTABLE}")
          fi
          GLSLC_ARGS=()
          if [[ -n "${VULKAN_GLSLC_EXECUTABLE}" && -x "${VULKAN_GLSLC_EXECUTABLE}" ]]; then
            GLSLC_ARGS=(-DVulkan_GLSLC_EXECUTABLE="${VULKAN_GLSLC_EXECUTABLE}")
          elif command -v glslc &>/dev/null; then
            GLSLC_ARGS=(-DVulkan_GLSLC_EXECUTABLE="$(command -v glslc)")
          fi
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DASR_BUILD_ENGINE=ON \
            -DASR_BUILD_TESTS=OFF \
            "${PKGCONFIG_ARGS[@]}" \
            "${GLSLC_ARGS[@]}" \
            ${{ matrix.cmake_args }}

      - name: Configure CMake (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          VCPKG_CRT_LINKAGE: static
        run: |
          cmake -B build `
            -DBUILD_SHARED_LIBS=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DASR_BUILD_ENGINE=ON `
            -DASR_BUILD_TESTS=OFF `
            ${{ matrix.cmake_args }}

      - name: Build (Linux)
        if: matrix.name == 'linux'
        shell: bash
        run: cmake --build build --config Release --parallel $(nproc)

      - name: Build (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      # ── package ───────────────────────────────
      - name: Package Release (Linux)
        if: matrix.name == 'linux'
        run: |
          mkdir -p asr-cpp-${{ matrix.name }}-${{ matrix.backend }}/models
          exe=build/bin/asr-cli
          if [[ ! -f "$exe" ]]; then
            exe=build/asr-cli
          fi
          cp "$exe" asr-cpp-${{ matrix.name }}-${{ matrix.backend }}/
          cp -r models/* asr-cpp-${{ matrix.name }}-${{ matrix.backend }}/models/ || true
          tar -czvf asr-cpp-${{ matrix.name }}-${{ matrix.backend }}.tar.gz asr-cpp-${{ matrix.name }}-${{ matrix.backend }}/

      - name: Package Release (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path asr-cpp-${{ matrix.name }}-${{ matrix.backend }}/models
          $exe = "build/Release/asr-cli.exe"
          if (-not (Test-Path $exe)) {
              $exe = "build/bin/Release/asr-cli.exe"
          }
          if (-not (Test-Path $exe)) {
              $exe = "build/bin/asr-cli.exe"
          }
          if (-not (Test-Path $exe)) {
              $exe = "build/asr-cli.exe"
          }
          Copy-Item $exe asr-cpp-${{ matrix.name }}-${{ matrix.backend }}/
          if (Test-Path models) {
              Copy-Item -Recurse models/* asr-cpp-${{ matrix.name }}-${{ matrix.backend }}/models/ -ErrorAction SilentlyContinue
          }
          Compress-Archive -Path asr-cpp-${{ matrix.name }}-${{ matrix.backend }} -DestinationPath asr-cpp-${{ matrix.name }}-${{ matrix.backend }}.zip

      # ── upload ───────────────────────────────
      - name: Upload Artifact (Linux)
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: asr-cpp-${{ matrix.name }}-${{ matrix.backend }}
          path: asr-cpp-${{ matrix.name }}-${{ matrix.backend }}.tar.gz

      - name: Upload Artifact (Windows)
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: asr-cpp-${{ matrix.name }}-${{ matrix.backend }}
          path: asr-cpp-${{ matrix.name }}-${{ matrix.backend }}.zip

  publish:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Determine release tag
        id: release-tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ inputs.release_tag }}" ]]; then
              release_tag="${{ inputs.release_tag }}"
            elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              release_tag="${GITHUB_REF_NAME}"
            else
              echo "release_tag input is required when dispatching from a branch" >&2
              exit 1
            fi
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release-tag.outputs.release_tag }}
          files: |
            artifacts/asr-cpp-linux-openblas.tar.gz
            artifacts/asr-cpp-linux-vulkan.tar.gz
            artifacts/asr-cpp-windows-openblas.zip
            artifacts/asr-cpp-windows-vulkan.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
